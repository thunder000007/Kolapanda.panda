  body::after {
    content:""; position:fixed; inset:0; z-index:-1;
    background:linear-gradient(135deg,rgba(0,0,0,.45),rgba(0,0,0,.72));
  }
  .ticker {
    position:sticky; top:0; z-index:5; overflow:hidden; white-space:nowrap;
    background:rgba(245,245,245,.94); color:var(--orange);
    border-bottom:3px solid var(--orange); padding:13px 0;
    font-size:clamp(1.5rem,4vw,2.5rem); font-weight:900;
    text-shadow:1px 2px 0 #555;
  }
  .ticker span { display:inline-block; padding-left:100%; animation:scroll 16s linear infinite; }
  @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-100%)} }
  .wrap { width:min(760px,92%); margin:32px auto 60px; }
  header { text-align:center; margin-bottom:24px; text-shadow:0 2px 10px #000; }
  header h1 { margin:0 0 8px; font-size:clamp(2rem,6vw,3.2rem); }
  header p { margin:0; color:#eee; }
  .panel {
    background:var(--glass); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.22); border-radius:20px;
    padding:clamp(18px,4vw,30px); margin:18px 0;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
  }
  details { border:1px solid rgba(255,255,255,.2); border-radius:12px; margin:12px 0; overflow:hidden; }
  summary {
    list-style:none; cursor:pointer; padding:16px 18px; font-size:1.15rem;
    font-weight:800; background:rgba(255,255,255,.09);
    display:flex; align-items:center; justify-content:space-between;
  }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"＋"; color:var(--orange); font-size:1.4rem; }
  details[open] summary::after { content:"−"; }
  ol, ul { margin:0; padding:8px 18px 14px 48px; }
  li { padding:11px 2px; border-bottom:1px solid rgba(255,255,255,.13); }
  li:last-child { border-bottom:0; }
  .price { float:right; color:#ffc17f; font-weight:800; margin-left:12px; }
  .note { color:#ddd; font-size:.92rem; text-align:center; }
  @media (prefers-reduced-motion:reduce) { .ticker span { animation:none; padding-left:0; } }
</style>
